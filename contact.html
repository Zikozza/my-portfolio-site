<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact · Ahmed Mamdouh</title>
<meta name="description" content="Start a 3D art project with Ahmed Mamdouh.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
</head>
<body>
<div id="site-header"></div>
<main data-page="contact">
<div class="wrap">
  <header class="page-head">
    <span class="eyebrow">Contact</span>
    <h1>Start a project</h1>
    <p class="lede">Tell me what you're building. I usually reply within two working days with questions or a first estimate.</p>
  </header>
  <div class="contact-grid" style="padding-bottom:4rem">
    <div class="contact-card">
      <div class="contact-line"><span class="mono muted">Email</span><span class="val"><span id="email"></span><button class="copy-btn" type="button" data-copy="#email">Copy</button></span></div>
      <div class="contact-line"><span class="mono muted">ArtStation</span><span class="val" id="artstation"></span></div>
      <div class="contact-line"><span class="mono muted">Availability</span><span class="val avail" id="avail"></span></div>
    </div>
    <div>
      <form id="contact-form">
        <div class="field-row">
          <div class="field"><label for="f-name">Name</label><input id="f-name" name="name" required autocomplete="name"></div>
          <div class="field"><label for="f-email">Email</label><input id="f-email" name="email" type="email" required autocomplete="email"></div>
        </div>
        <div class="field-row">
          <div class="field"><label for="f-service">Service</label><select id="f-service" name="service"></select></div>
          <div class="field"><label for="f-timeline">Timeline</label><select id="f-timeline" name="timeline">
            <option value="">Flexible</option><option>As soon as possible</option><option>Within a month</option><option>1–3 months</option></select></div>
        </div>
        <div class="field"><label for="f-message">Project details</label><textarea id="f-message" name="message" required placeholder="Platform, number of assets or spaces, references, deadline"></textarea></div>
        <div class="btn-row"><button class="btn btn-primary arrow" type="submit">Send message</button></div>
        <div class="result" id="form-result" hidden></div>
      </form>
    </div>
  </div>
</div>
</main>
<div id="site-footer"></div>
<script src="assets/js/content.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
